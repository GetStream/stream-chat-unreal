; iOS specific overrides for Input.ini settings. UInputSettings is config=Input, so these have to
; live here rather than in IOSEngine.ini, where they would be read by nothing.

[/Script/Engine.InputSettings]
; The default virtual joystick interface is created on touch platforms and consumes touches across
; the whole screen, which stops UMG widgets ever seeing a tap or a scroll. There is nothing to drive
; with a joystick in a chat app.
DefaultTouchInterface=None

; Capturing the viewport permanently is meant for a game that owns the pointer. Leaving input
; uncaptured lets Slate route touches to the widgets.
DefaultViewportMouseCaptureMode=NoCapture
DefaultViewportMouseLockMode=DoNotLock
