; iOS specific overrides for Engine.ini settings.

[/Script/Engine.UserInterfaceSettings]
; The UI scale on iOS is defined absolutely here, rather than inheriting the desktop UIScaleCurve and
; multiplying it by a hand-tuned ApplicationScale.
;
; This used to be ApplicationScale=1.75. That multiplies the curve result, so what a handset actually
; got was `desktopCurve(viewport) x 1.75`, which made the phone depend on a desktop decision in a way
; nobody could see. It worked here only because this project's curve has its first key at 2160 and so
; clamps to 1.0 on a phone. Copy the same 1.75 into a project that uses the engine's default curve
; and you get 1.27 instead, because that curve interpolates to 0.727 at a 786px shortest side, and the
; UI comes out a quarter smaller for no visible reason. It also silently moved if the desktop curve or
; UIScaleRule (Vertical here) ever changed.
;
; The value: UE renders the iOS viewport at r.MobileContentScaleFactor = 2, so viewport pixels =
; iOS points x 2. A DPI scale of exactly 2.0 therefore makes 1 UMG unit equal 1 iOS point, so a
; 14-unit font renders at 14pt, matching native iOS text. That is the natural target, it needs no
; per-device tuning (every iPhone renders at 2x here), and it is slightly larger than the old 1.75.
;
; KEEP IN SYNC: this must equal r.MobileContentScaleFactor. If the app ever renders natively (3x),
; this becomes 3.0.
;
; The curve is flat on purpose, so it cannot drift with viewport size and UIScaleRule stops mattering
; on iOS. Nudge both keys together to scale the whole UI.
UIScaleCurve=(EditorCurveData=(Keys=((Time=0.000000,Value=2.000000),(Time=8640.000000,Value=2.000000)),PreInfinityExtrap=RCCE_Constant,PostInfinityExtrap=RCCE_Constant),ExternalCurve=None)
ApplicationScale=1.000000

; Not set here: r.MobileContentScaleFactor. The iOS device profile renders at 2x rather than the
; device's native 3x, so a phone upscales the backbuffer to the screen. Setting it in project config
; has no effect, because BaseDeviceProfiles.ini applies +CVars=r.MobileContentScaleFactor=2 after
; project config; it would have to be overridden in the IOS device profile instead. Left alone
; deliberately, since rendering natively costs fill rate on a handset. Note the UIScaleCurve above
; assumes that 2x.

[SystemSettings]
; Each avatar sits in a retainer box, which renders its subtree into its own render target every
; frame. On a handset that exhausts Slate's draw buffers, and the game thread then blocks in
; GetDrawBuffer forever: the app froze on frame 31 while logging the same warning 443k times.
; Retained rendering is a desktop optimisation, so it is off here.
Slate.EnableRetainedRendering=0
