; iOS specific overrides for Engine.ini settings.

[/Script/Engine.UserInterfaceSettings]
; The project's UIScaleCurve is authored for desktop resolutions and its first key is at a height of
; 2160, so a phone viewport falls below it and clamps to a scale of 1. That leaves the desktop derived
; layout far too small on a handset, so scale it up here rather than disturb the desktop samples.
ApplicationScale=1.750000

; Not set here: r.MobileContentScaleFactor. The iOS device profile renders at 2x rather than the
; device's native 3x, so a phone upscales the backbuffer to the screen. Setting it in project config
; has no effect, because BaseDeviceProfiles.ini applies +CVars=r.MobileContentScaleFactor=2 after
; project config; it would have to be overridden in the IOS device profile instead. Left alone
; deliberately, since rendering natively costs fill rate on a handset.

[SystemSettings]
; Each avatar sits in a retainer box, which renders its subtree into its own render target every
; frame. On a handset that exhausts Slate's draw buffers, and the game thread then blocks in
; GetDrawBuffer forever: the app froze on frame 31 while logging the same warning 443k times.
; Retained rendering is a desktop optimisation, so it is off here.
Slate.EnableRetainedRendering=0
