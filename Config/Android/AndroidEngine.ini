; Android specific overrides for Engine.ini settings.

[/Script/Engine.UserInterfaceSettings]
; The project's UIScaleCurve is authored for desktop resolutions, so a phone gets a scale of roughly
; 1 and the desktop derived layout comes out too small. Measured on a 1080x2220 440dpi handset, the
; channel list rendered 17 rows at a 7.3mm pitch against 10.6mm on iOS, so 70% of the physical size
; there. This brings the two platforms to the same physical size rather than disturbing the desktop
; samples. Keep it in step with ApplicationScale in Config/IOS/IOSEngine.ini.
ApplicationScale=1.440000

[SystemSettings]
; Each avatar sits in a retainer box, which renders its subtree into its own render target every
; frame. On a handset that exhausts Slate's draw buffers and the game thread then blocks in
; GetDrawBuffer indefinitely. Measured here: the channel list reached frame 53, drew 10 distinct
; frames and logged this 348,950 times, which is the same failure seen on iOS. Retained rendering is
; a desktop optimisation, so it is off here too.
Slate.EnableRetainedRendering=0
