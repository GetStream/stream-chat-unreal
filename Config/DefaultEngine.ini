[/Script/Engine.NetworkSettings]
; Required for packaged builds to be able to connect to Stream at all.
;
; The chat client talks to Stream over a secure WebSocket, so it needs CA root certificates to verify
; Stream's server certificate. The engine ships them at
; Engine/Content/Certificates/ThirdParty/cacert.pem, and UAT stages that file into packaged builds,
; but only if this setting is present:
;
;     // CopyBuildToStagingDirectory.Automation.cs
;     bool bStageSSLCertificates = true;
;     PlatformEngineConfig.GetBool("/Script/Engine.NetworkSettings", "n.VerifyPeer", out bStageSSLCertificates);
;
; GetBool writes to the out parameter even when the key is absent (ConfigHierarchy.cs sets it to
; false), so the `true` above is dead code. Leave this unset and no certificates are staged, and every
; wss:// connection in the packaged app fails with
;   LogWebSockets: Warning: Lws(Error): SSL error: unable to get local issuer certificate
; while the client retries forever. Nothing in BaseEngine.ini sets a default, so every project starts
; in that state, and the editor hides it by reading the engine's copy straight from disk.
;
; This does not make the app less strict. At runtime the value is only applied if the key exists
; (CurlHttpManager.cpp guards its GetBool with an if), so an unset key already meant "verify the peer".
; Setting it explicitly just makes packaging agree with the runtime behaviour.
;
; This replaces an older workaround that bundled a copy of the engine's cacert.pem at
; Content/Certificates/cacert.pem and staged it with
; +DirectoriesToAlwaysStageAsNonUFS=(Path="Certificates"). That bypassed this gate rather than setting
; it, duplicated a 208 KB engine file, and used NonUFS unnecessarily: the certificates are read
; through UE's pak-aware file APIs, since the WebSockets module obtains them via
; FSslModule::Get().GetCertificateManager().AddCertificatesToSslContext().
n.VerifyPeer=True

