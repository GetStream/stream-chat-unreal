name: Docs

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
    paths:
      - Plugins/StreamChat/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: 🔨 Generate documentation
    runs-on: ubuntu-latest

    permissions:
      # actions-gh-pages commits the generated site to the gh-pages branch, so this job needs write
      # access to contents. The workflow default above stays read only.
      contents: write

    steps:
      - uses: actions/checkout@v3
        name: 🛒 Checkout

      - uses: mattnotmitt/doxygen-action@v1
        name: 🖨️ Doxygen
        with:
            additional-packages: python3
            working-directory: 'Plugins/StreamChat'

      - uses: peaceiris/actions-gh-pages@v3
        name: 🚀 Deploy to GitHub Pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Plugins/StreamChat/Docs/html
